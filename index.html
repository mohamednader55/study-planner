<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudyPlanner — Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

  <!-- Background orbs -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <span class="logo-icon"><i class="fas fa-brain"></i></span>
      <span class="logo-text">Study<span>Planner</span></span>
    </div>
    <nav>
      <a href="index.html" class="nav-link active">
        <i class="fas fa-calendar-day"></i> Today's Plan
      </a>
      <a href="subjects.html" class="nav-link">
        <i class="fas fa-book-open"></i> Subjects
      </a>
      <a href="progress.html" class="nav-link">
        <i class="fas fa-chart-line"></i> Progress
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="date-display" id="sidebarDate"></div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">

    <!-- Header -->
    <header class="page-header">
      <div>
        <p class="page-label">Dashboard</p>
        <h1 class="page-title">Today's Plan <span id="greetingEmoji">☀️</span></h1>
      </div>
      <div class="header-stats">
        <div class="stat-pill">
          <i class="fas fa-fire"></i>
          <span id="streakCount">0</span> day streak
        </div>
        <div class="stat-pill">
          <i class="fas fa-check-circle"></i>
          <span id="completedToday">0</span> done today
        </div>
      </div>
    </header>

    <!-- Empty state -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon"><i class="fas fa-graduation-cap"></i></div>
      <h2>No subjects yet</h2>
      <p>Add your subjects and exam dates to generate your personalized study plan.</p>
      <a href="subjects.html" class="btn btn-primary">
        <i class="fas fa-plus"></i> Add Subjects
      </a>
    </div>

    <!-- Today's tasks -->
    <section class="tasks-section" id="tasksSection" style="display:none">
      <div class="section-header">
        <h2>Today's Sessions</h2>
        <div class="progress-summary">
          <span id="progressText">0 / 0 completed</span>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="dayProgressBar" style="width:0%"></div>
          </div>
        </div>
      </div>

      <div class="task-grid" id="taskGrid">
        <!-- Tasks injected by JS -->
      </div>
    </section>

    <!-- Upcoming exams -->
    <section class="upcoming-section" id="upcomingSection" style="display:none">
      <h2>Upcoming Exams</h2>
      <div class="exam-list" id="examList"></div>
    </section>

  </main>

  <script src="js/storage.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
