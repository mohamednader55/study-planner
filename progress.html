<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudyPlanner — Progress</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <aside class="sidebar">
    <div class="logo">
      <span class="logo-icon"><i class="fas fa-brain"></i></span>
      <span class="logo-text">Study<span>Planner</span></span>
    </div>
    <nav>
      <a href="index.html" class="nav-link">
        <i class="fas fa-calendar-day"></i> Today's Plan
      </a>
      <a href="subjects.html" class="nav-link">
        <i class="fas fa-book-open"></i> Subjects
      </a>
      <a href="progress.html" class="nav-link active">
        <i class="fas fa-chart-line"></i> Progress
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="date-display" id="sidebarDate"></div>
    </div>
  </aside>

  <main class="main-content">

    <header class="page-header">
      <div>
        <p class="page-label">Analytics</p>
        <h1 class="page-title">Progress</h1>
      </div>
      <div class="header-stats">
        <div class="stat-pill">
          <i class="fas fa-fire"></i>
          <span id="streakCount">0</span> day streak
        </div>
      </div>
    </header>

    <!-- Overview cards -->
    <div class="stats-grid" id="statsGrid">
      <div class="stats-card">
        <div class="stats-icon" style="color:#a855f7"><i class="fas fa-book-open"></i></div>
        <div class="stats-info">
          <span class="stats-value" id="totalSubjects">0</span>
          <span class="stats-label">Total Subjects</span>
        </div>
      </div>
      <div class="stats-card">
        <div class="stats-icon" style="color:#10b981"><i class="fas fa-check-double"></i></div>
        <div class="stats-info">
          <span class="stats-value" id="totalCompleted">0</span>
          <span class="stats-label">Sessions Completed</span>
        </div>
      </div>
      <div class="stats-card">
        <div class="stats-icon" style="color:#f59e0b"><i class="fas fa-clock"></i></div>
        <div class="stats-info">
          <span class="stats-value" id="totalHours">0h</span>
          <span class="stats-label">Hours Studied</span>
        </div>
      </div>
      <div class="stats-card">
        <div class="stats-icon" style="color:#ef4444"><i class="fas fa-calendar-check"></i></div>
        <div class="stats-info">
          <span class="stats-value" id="nearestExam">—</span>
          <span class="stats-label">Next Exam In</span>
        </div>
      </div>
    </div>

    <!-- Per subject progress -->
    <section class="progress-section">
      <h2>Subject Progress</h2>
      <div class="empty-state" id="emptyState">
        <div class="empty-icon"><i class="fas fa-chart-bar"></i></div>
        <h2>No data yet</h2>
        <p>Add subjects and complete study sessions to track your progress.</p>
        <a href="subjects.html" class="btn btn-primary">
          <i class="fas fa-plus"></i> Add Subjects
        </a>
      </div>
      <div id="progressList" style="display:none"></div>
    </section>

    <!-- Weekly heatmap -->
    <section class="heatmap-section" id="heatmapSection" style="display:none">
      <h2>This Week's Activity</h2>
      <div class="heatmap" id="weekHeatmap"></div>
    </section>

  </main>

  <script src="js/storage.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
